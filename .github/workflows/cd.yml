name: CD — Deploy to Staging

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/fit-calendar-api
  BOT_IMAGE: ghcr.io/${{ github.repository_owner }}/fit-calendar-bot

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build api and bot apps
        run: pnpm nx run-many -t build -p api bot

      - name: Set image SHA tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build → scan → push. The build is cached by docker/build-push-action,
      # so the post-scan push reuses layers and stays fast. Trivy fails the
      # workflow on HIGH/CRITICAL CVEs with available fixes (`--ignore-unfixed`
      # silences un-actionable noise from base-image deps). If you need to
      # ship despite a flagged CVE, document it in the workflow comments —
      # don't add a blanket allowlist.
      - name: Build API image (load only, scan before push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/apps/Dockerfile.api
          load: true
          push: false
          tags: fit-calendar-api:scan

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fit-calendar-api:scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/apps/Dockerfile.api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.sha_tag }}

      - name: Build Bot image (load only, scan before push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/apps/Dockerfile.bot
          load: true
          push: false
          tags: fit-calendar-bot:scan

      - name: Scan Bot image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fit-calendar-bot:scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Push Bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/apps/Dockerfile.bot
          push: true
          tags: |
            ${{ env.BOT_IMAGE }}:latest
            ${{ env.BOT_IMAGE }}:${{ steps.meta.outputs.sha_tag }}

  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_WORK_DIR }}
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            echo "Deploy complete — SHA: ${{ needs.build-and-push.outputs.sha_tag }}"
