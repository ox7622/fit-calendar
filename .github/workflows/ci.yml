name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Supply-chain gate. Currently set to `critical` because the baseline
      # has 13 high-severity advisories in transitive deps (typeorm, multer,
      # path-to-regexp, etc.) that need coordinated upstream bumps. Ratchet
      # to `high` once the next round of dependency bumps lands.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

      - name: Set Nx SHAs for affected computation
        uses: nrwl/nx-set-shas@v4

      - name: Restore Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint affected projects
        run: pnpm nx affected -t lint --parallel=3

      - name: Typecheck affected projects
        run: pnpm nx affected -t typecheck --parallel=3

      - name: Test affected projects
        run: pnpm nx affected -t test --parallel=3 --ci

      - name: Build affected projects
        run: pnpm nx affected -t build --parallel=3

      - name: Verify Docker image build (api) — no push
        if: ${{ contains(env.NX_AFFECTED_APPS, 'api') || github.event_name == 'push' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/apps/Dockerfile.api
          push: false
          tags: fit-calendar-api:ci

      - name: Verify Docker image build (bot) — no push
        if: ${{ contains(env.NX_AFFECTED_APPS, 'bot') || github.event_name == 'push' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/apps/Dockerfile.bot
          push: false
          tags: fit-calendar-bot:ci
