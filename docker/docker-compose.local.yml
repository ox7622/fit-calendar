services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: fitcalendar-postgres
    environment:
      POSTGRES_DB: ${NX_DB_NAME:-fitcalendar}
      POSTGRES_USER: ${NX_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NX_DB_PASS:-postgres}
    ports:
      - "${NX_DB_PORT:-5432}:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NX_DB_USER:-postgres} -d ${NX_DB_NAME:-fitcalendar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (optional - for caching/sessions)
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   container_name: fitcalendar-redis
