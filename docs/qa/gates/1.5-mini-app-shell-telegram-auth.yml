story_title: "Mini App Shell & Telegram Auth"
gate: PASS
status_reason: "All 8 acceptance criteria met. HMAC-SHA256 initData validation matches Telegram spec. 16 unit tests cover the auth path (7 guard + 9 user service); full API suite (61 tests across 7 suites) passes. Three low-severity findings logged for follow-up; none block release."
