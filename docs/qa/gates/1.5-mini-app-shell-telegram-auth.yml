waiver: { active: false }

top_issues:
  - id: "SEC-001"
    severity: low
    finding: "Hash comparison uses string equality (=== ) instead of crypto.timingSafeEqual()."
    location: "apps/api/src/common/guards/telegram-auth.guard.ts:143"
    impact: "Theoretical timing side-channel on HMAC verification. Practical exploitability is very low against a remote endpoint with network jitter, and Telegram's docs do not require constant-time comparison. Still, it's a Node.js idiom for HMAC checks."
    suggested_action: "Replace `hash === calculatedHash` with `crypto.timingSafeEqual(Buffer.from(hash, 'hex'), Buffer.from(calculatedHash, 'hex'))`. Wrap in length check first to avoid throw."

  - id: "TEST-001"
    severity: low
    finding: "No frontend tests for AuthProvider despite security-sensitive flow."
    location: "apps/mini-app/src/app/providers/AuthProvider.tsx"
    impact: "Story marked frontend tests 'optional for MVP'. Behaviors that benefit from coverage: loading→error→retry transitions, the dual isInTelegram() check (once in authenticate(), again in render), error classification (auth vs server vs network)."
    suggested_action: "Add Vitest tests for AuthProvider before adding more auth-dependent flows in Epic 5 (reminder subscription is gated by the same auth)."

  - id: "ARCH-001"
    severity: low
    finding: "parseInitData() runs before validateInitData() — untrusted JSON is parsed before signature is verified."
    location: "apps/api/src/common/guards/telegram-auth.guard.ts:62-68"
    impact: "Functionally safe (JSON.parse throws are caught and converted to 401), but conceptually inverted: validate signature first, then parse. Current ordering means malformed but unsigned input goes through JSON.parse before being rejected for bad hash."
    suggested_action: "Swap order: validate hash first, return 401 on failure, then parse. Reduces attack surface against any future parser bugs."

