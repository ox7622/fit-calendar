# Render Blueprint — FitCalendar API (Docker). No-card free stack:
# this API on Render (free) + Neon Postgres (external) + Cloudflare Pages (frontends)
# + an UptimeRobot pinger to keep the free instance awake. See docs/deploy/render-runbook.md.
services:
    - type: web
      name: fitcalendar-api
      runtime: docker
      repo: https://github.com/ox7622/fit-calendar
      branch: develop
      dockerfilePath: ./docker/Dockerfile.prod-api
      plan: free
      region: frankfurt
      healthCheckPath: /api/schedule/today
      envVars:
          # --- non-secret, safe to commit ---
          - key: NODE_ENV
            value: production
          - key: NX_DB_SSL # Neon is external → TLS required
            value: 'true'
          - key: NX_DB_SCHEMA
            value: public
          - key: NX_BE_API_FITCALENDAR_SERVICE_PORT
            value: '3000'
          - key: NX_BE_API_FITCALENDAR_SERVICE_PREFIX
            value: api
          - key: SWAGGER_ENABLED
            value: 'false'
          # --- secrets / per-deploy values: set in the Render dashboard ---
          - key: NX_DB_HOST # from Neon connection details
            sync: false
          - key: NX_DB_PORT
            sync: false
          - key: NX_DB_NAME
            sync: false
          - key: NX_DB_USER
            sync: false
          - key: NX_DB_PASS
            sync: false
          - key: JWT_SECRET
            sync: false
          - key: TELEGRAM_BOT_TOKEN
            sync: false
          - key: TELEGRAM_WEBHOOK_SECRET
            sync: false
          - key: API_URL # Render service URL (bare origin, no /api)
            sync: false
          - key: MINI_APP_URL # Cloudflare Pages URL of the mini-app
            sync: false
          - key: CORS_ORIGIN_MINI_APP
            sync: false
          - key: CORS_ORIGIN_ADMIN
            sync: false
          - key: YANDEX_GEOCODER_API_KEY
            sync: false
          - key: CLOUDINARY_CLOUD_NAME
            sync: false
          - key: CLOUDINARY_API_KEY
            sync: false
          - key: CLOUDINARY_API_SECRET
            sync: false
